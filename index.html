<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanguard Education — Coming Soon</title>
  <meta name="description" content="Vanguard Education — our new website is on its way.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f2a4a'/><path d='M16 18h8l8 22 8-22h8L36 48h-8z' fill='%23f5b942'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1f38;
      --bg-2: #12325a;
      --text: #f4f6fa;
      --muted: #b7c3d6;
      --accent: #f5b942;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 80% -10%, var(--bg-2), transparent 60%),
                  radial-gradient(900px 500px at -10% 110%, #1a2f4f, transparent 60%),
                  var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 16px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      display: grid; place-items: center;
      margin-bottom: 28px;
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 16px;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1.05;
      margin-bottom: 20px;
    }
    p.lead {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 36px;
    }
    .contact {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--accent);
      color: #1b1404;
      font-weight: 500;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245,185,66,0.25);
    }
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 64 64"><path d="M10 12h11l11 30 11-30h11L38 54H26z" fill="#f5b942"/></svg>
    </div>
    <div class="eyebrow">Coming Soon</div>
    <h1>Vanguard Education</h1>
    <p class="lead">
      We're building something new. Our website is on its way. Check back soon.
    </p>
    <a class="contact" href="mailto:info@vanguardeducation.org">Get in touch</a>
  </main>
  <footer>&copy; <span id="y">2026</span> Vanguard Education. All rights reserved.</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
